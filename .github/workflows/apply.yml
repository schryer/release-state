# Keep the repositories' rulesets to what state.json says: on each merge that changes
# it, and each night, so a ruleset changed by hand is put back. It applies pubkit's
# rulesets to each repository with "protect" on, by that repository's own protect
# block. Turning "protect" off only stops this looking at a repository: it never
# removes a ruleset, because a bad save shouldn't be able to strip protection.
#
# It only reports until the repository variable RELEASE_APPLY_MODE is "apply".
#
# It runs as the schryer-release-protect app, whose key is in this repository's
# apply environment, which only main may use.
name: apply

on:
  push:
    branches: [main]
    paths: [state.json]
  schedule: [{ cron: '23 3 * * *' }]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apply
  cancel-in-progress: false

jobs:
  apply:
    name: state / apply
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: apply
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: '3.14' }
      - run: python -m pip install --quiet --only-binary ':all:' --require-hashes -r tests/requirements.lock
      - id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: '${{ vars.RELEASE_PROTECT_APP_ID }}'
          private-key: '${{ secrets.RELEASE_PROTECT_APP_KEY }}'
          owner: '${{ github.repository_owner }}'
          permission-administration: write
          permission-contents: read
      - name: Bring the rulesets in line
        env:
          GH_TOKEN: '${{ steps.app.outputs.token }}'
          MODE: '${{ vars.RELEASE_APPLY_MODE }}'
        run: |
          jq '{repositories: [.owner as $owner | .repos | to_entries[] | select(.value.protect) | {repo: "\($owner)/\(.key)", protect: true}]}' state.json > repos.json
          if [ "$MODE" = apply ]; then
            pubkit protect --repos repos.json | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "Only reporting: RELEASE_APPLY_MODE isn't apply." | tee -a "$GITHUB_STEP_SUMMARY"
            pubkit protect --check --repos repos.json | tee -a "$GITHUB_STEP_SUMMARY" || true
          fi
